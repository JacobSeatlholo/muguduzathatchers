name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      # Route handlers are not supported by `output: "export"`, so move the
      # API folder aside for the static build (CI checkout is ephemeral).
      - name: Prepare static export
        run: |
          if [ -d src/app/api ]; then
            mv src/app/api .api-backup
          fi

      - name: Build static site
        env:
          NEXT_EXPORT: "true"
          NEXT_BASE_PATH: /muguduzathatchers
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # auto-enable Pages (Source: GitHub Actions) on first deploy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
